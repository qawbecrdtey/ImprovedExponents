name = "ImprovedExponents"
version = "0.1.0"
defaultTargets = ["ImprovedExponents", "ImprovedChallenge", "ImprovedSolution"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false # no copyright headers in this project
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.35.0-rc2"

# The formalization of the paper (Alman, Vassilevska Williams) that this project builds on: the part
# of anthropics/formal-math, directory 3sum-apsp, commit e1a4e6508154ea59f030480661590a9fe3018011,
# that this project uses, ported to Lean v4.35.0-rc2 (Copyright (c) 2026 Anthropic, PBC, Apache
# License 2.0; see upstream/README.md and NOTICE). Its three libraries are upstream's and keep
# upstream's options: the linters and `maxSynthPendingDepth` set above for this project are reset.
# The warnings on deprecated names, syntax and modules are off, so that the port changes only what no
# longer compiles (`weak.linter.deprecated` because TOML cannot also nest `linter.deprecated.module` in it).
[[lean_lib]]
name = "EndStatement"
srcDir = "upstream/3sum-apsp"
[lean_lib.leanOptions]
maxSynthPendingDepth = 1
linter.deprecated.module = false
linter.deprecated.syntax = false
weak.linter.deprecated = false
weak.linter.mathlibStandardSet = false

[[lean_lib]]
name = "PaperStatements"
srcDir = "upstream/3sum-apsp"
[lean_lib.leanOptions]
maxSynthPendingDepth = 1
linter.deprecated.module = false
linter.deprecated.syntax = false
weak.linter.deprecated = false
weak.linter.mathlibStandardSet = false

[[lean_lib]]
name = "ThreeSumApsp"
srcDir = "upstream/3sum-apsp"
globs = ["ThreeSumApsp.+"]
[lean_lib.leanOptions]
maxSynthPendingDepth = 1
linter.deprecated.module = false
linter.deprecated.syntax = false
weak.linter.deprecated = false
weak.linter.mathlibStandardSet = false

# The proofs.
[[lean_lib]]
name = "ImprovedExponents"

# The statement module for Comparator and the Palomar registry: the four strongest bounds, each with
# `sorry` in place of its proof, stated with a verbatim copy of upstream's EndStatement.lean and no
# import at all (scripts/check-endstatement.sh checks the copy).
[[lean_lib]]
name = "ImprovedChallenge"

# The proofs of the theorems of ImprovedChallenge, imported from the library.
[[lean_lib]]
name = "ImprovedSolution"

