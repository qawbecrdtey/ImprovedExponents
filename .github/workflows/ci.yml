name: CI

# The checks of README.md, "How to check": the source requirements of the Palomar registry, the
# metadata, the copy of upstream in upstream/3sum-apsp/, the build with no `sorry` outside the
# statement module, the generated certificates, the Python tests, the Lean names cited by the paper,
# and the toolchain's `lake comparator` as the registry runs it. Actions are pinned to commits.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sources:
    name: Source requirements and metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          ruby-version: "3.3.12"
      - name: Every Lean file uses the module system and has at most 10,000 lines
        run: python3 scripts/check-lean-sources.py
      - name: formalization.yaml has no template value and declares Apache-2.0
        run: ruby scripts/validate-formalization.rb
      - name: upstream/3sum-apsp is upstream's commit, every change listed and marked
        run: scripts/check-upstream.sh
      - name: The generated certificates match their generator
        run: python3 -m search.certs --check
      - name: Python tests
        run: python3 -m unittest discover -s search/tests -t .

  build:
    name: Build with Lean
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Lean source requirements before builds
        run: python3 scripts/check-lean-sources.py
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          build: true
          build-args: "--wfail ImprovedExponents ImprovedSolution"
      - name: Build the statement module (its four `sorry` warnings are deliberate)
        run: lake build ImprovedChallenge
      - name: The copy of EndStatement.lean in the statement module is verbatim
        run: scripts/check-endstatement.sh
      - name: Every Lean name cited by the paper exists
        run: python3 papers/improved-exponents/check_lean_names.py

  comparator:
    name: Statement against solution (lake comparator)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Free disk space
        # The runner's disk is tight for the toolchain, the compiled Mathlib and the sandboxed build of
        # the whole library; remove preinstalled SDKs this job never uses.
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force >/dev/null
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Lean source requirements before builds
        run: python3 scripts/check-lean-sources.py
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          build: false
      - name: Install bubblewrap for lake comparator's sandbox
        # As in the Palomar starter template: Ubuntu 24.04 restricts unprivileged user namespaces
        # through AppArmor, which `bwrap` needs for the sandbox; the runner is disposable.
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq bubblewrap >/dev/null
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: The toolchain's lake comparator, with the bundled kernels NanoDa and con-ron
        # In a fresh copy of the sources (no build products, whatever the cache restored), rebuilds
        # the challenge and the solution in the sandbox, compares the four statements, checks the
        # axioms and replays the proofs, as the registry does.
        env:
          COMPARATOR_RUNS: ${{ runner.temp }}/comparator-runs
        run: scripts/verify-comparator.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: comparator-log
          path: ${{ runner.temp }}/comparator-runs/*.log
          if-no-files-found: ignore
